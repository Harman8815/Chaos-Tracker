<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenTrack - Daily Wellness Dashboard</title>
    <script type="importmap">
      {
        "imports": {
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
          "recharts": "https://aistudiocdn.com/recharts@^3.3.0"
        }
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Dark Theme (default)
              'primary': '#1F2023',
              'secondary': '#2B2D31',
              'accent': '#5865F2',
              'accent-hover': '#4752C4',
              'text-primary': '#F2F3F5',
              'text-secondary': '#B8B9BF',
              'border-color': '#3A3C42',
              // Light Theme
              'light-primary': '#F2F3F5',
              'light-secondary': '#FFFFFF',
              'light-accent': '#5865F2',
              'light-accent-hover': '#4752C4',
              'light-text-primary': '#1F2023',
              'light-text-secondary': '#5c5e66',
              'light-border-color': '#E3E5E8',
            },
            keyframes: {
                fadeIn: {
                    '0%': { opacity: 0 },
                    '100%': { opacity: 1 },
                },
            },
            animation: {
                fadeIn: 'fadeIn 0.5s ease-in-out',
            },
          },
        },
      }
    </script>
</head>
<body class="bg-light-primary dark:bg-primary">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
